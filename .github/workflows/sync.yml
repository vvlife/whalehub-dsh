name: Sync registry & deploy

on:
  schedule:
    - cron: '17 3 * * *' # 每日 03:17 UTC（错峰）
  workflow_dispatch:
  push:
    branches: [main]

# 同步提交与部署都需要写仓库内容（gh-pages 推送、registry 提交）；
# 处理提交 issue 需要写 issues（留言 + 关闭）
permissions:
  contents: write
  issues: write

# 避免每日定时与 push 并发部署互相踩踏
concurrency:
  group: deploy-whalehub
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Process plugin submission issues (accept → registry, reject → comment + close)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/process-issues.mjs
      - name: Sync registry from awesome list + GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-registry.mjs
      - name: Validate registry
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Validate plugins are real DSH plugins
        run: node scripts/validate-plugins.mjs

      # 本 job 从 checkout 到 commit 之间会跑好几分钟，期间 main 可能已被推进
      # （合并 PR、手动推送、另一次 workflow run）。此时直接 push 会被
      # non-fast-forward 拒绝 —— 而这步失败意味着上面已经关闭的插件提交 issue
      # 所对应的 issue-submissions.json 改动全部丢失（issue 已关，下次不会再处理）。
      # 所以提交前先把自己 rebase 到最新 main：--autostash 会把尚未提交的
      # registry 改动临时收起，rebase 完再放回。
      - name: Rebase onto latest main before committing
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin main
          git pull --rebase --autostash origin main

      - name: Commit registry changes (if any)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(registry): daily sync from awesome list + issue submissions'
          file_pattern: 'registry/plugins.json plugin/registry/plugins.json scripts/issue-submissions.json'

      # ---------- 部署 ----------
      - name: Build site (bundles registry/plugins.json into JS)
        run: npm run build

      - name: Deploy to GitHub Pages (国内备用镜像)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com

      # 不用 amondnet/vercel-action（其内置 CLI 过旧，被服务端拒绝），
      # 直接拉最新 Vercel CLI，走官方无链接部署模式（靠三个 env 定位项目）。
      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx -y vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
